name: build

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  check:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: android apk
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Release signing with the upload keystore from the ANDROID_* secrets.
      # Fork pull requests cannot read secrets: the step is skipped and Gradle
      # falls back to the debug keystore (see android/app/build.gradle.kts).
      - name: install upload keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - run: |
          cp build/app/outputs/flutter-apk/app-release.apk zhang-app-android.apk
          cp build/app/outputs/bundle/release/app-release.aab zhang-app-android.aab
      - name: verify signer
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          # SHA-256 of the upload keystore certificate (docs/ci.md).
          EXPECTED_SHA256: 2da507b3b35fbe8607c31e52f7e5cf2fd7a850438eb4e815161288bf55b2f690
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "apksigner from $BT"
          "$BT/apksigner" verify --verbose --print-certs zhang-app-android.apk | tee signer.txt
          if [ -n "$KEYSTORE_BASE64" ]; then
            grep -qi "$EXPECTED_SHA256" signer.txt || { echo "::error::apk is not signed with the upload keystore"; exit 1; }
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zhang-app-android
          path: |
            zhang-app-android.apk
            zhang-app-android.aab
          if-no-files-found: error

  # Pull requests (incl. forks, which can't read secrets) only verify the build
  # compiles. Pushes / tags / manual runs sign an App Store ipa; only tags and
  # manual runs upload it to TestFlight.
  ios:
    name: ios ipa
    runs-on: macos-latest
    needs: check
    env:
      BUNDLE_ID: com.zhangaccounting.app
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SIGN: ${{ github.event_name != 'pull_request' }}
      UPLOAD: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - if: env.SIGN != 'true'
        run: flutter build ios --release --no-codesign

      - name: import distribution certificate
        if: env.SIGN == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: install provisioning profile
        if: env.SIGN == 'true'
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      # Switch the Runner target to manual distribution signing for this CI
      # build only; the committed project keeps automatic signing for local dev.
      - name: configure manual signing
        if: env.SIGN == 'true'
        run: |
          cat >> ios/Flutter/Release.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $TEAM_ID
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME
          EOF
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

      # Build number must be unique per upload, so use the run number.
      - if: env.SIGN == 'true'
        run: flutter build ipa --release --build-number=${{ github.run_number }} --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
      - if: env.SIGN == 'true'
        run: cp build/ios/ipa/*.ipa zhang-app-ios.ipa
      - if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zhang-app-ios-signed
          path: zhang-app-ios.ipa
          if-no-files-found: error

      - name: upload to testflight
        if: env.UPLOAD == 'true'
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: zhang-app-ios.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

  release:
    name: github release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [android, ios]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zhang-app-android.apk
            dist/zhang-app-android.aab
          generate_release_notes: true

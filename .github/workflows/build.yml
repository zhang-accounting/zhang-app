name: build

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  check:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: android apk
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Release build signed with the debug keystore until a real keystore is
      # configured (see docs/ci.md). Installable by sideloading.
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk zhang-app-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zhang-app-android
          path: zhang-app-android.apk
          if-no-files-found: error

  ios:
    name: ios unsigned ipa
    runs-on: macos-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      # Package the unsigned .app as an .ipa; sign it later with your own
      # certificate (Xcode, Sideloadly, AltStore, fastlane) – see docs/ci.md.
      - run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr zhang-app-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: zhang-app-ios-unsigned
          path: zhang-app-ios-unsigned.ipa
          if-no-files-found: error

  release:
    name: github release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [android, ios]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zhang-app-android.apk
            dist/zhang-app-ios-unsigned.ipa
          generate_release_notes: true
